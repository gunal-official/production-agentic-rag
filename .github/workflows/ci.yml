name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: agentic_rag
          POSTGRES_USER: agentic_rag
          POSTGRES_PASSWORD: agentic_rag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentic_rag -d agentic_rag"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: apps/api

    env:
      DATABASE_URL: postgresql+asyncpg://agentic_rag:agentic_rag@localhost:5432/agentic_rag
      GROQ_API_KEY: test-key
      GROQ_MODEL: llama-3.3-70b-versatile
      PHOENIX_ENABLED: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Enable pgvector
        run: |
          PGPASSWORD=agentic_rag psql \
            -h localhost \
            -U agentic_rag \
            -d agentic_rag \
            -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Run migrations
        run: alembic upgrade head

      - name: Ruff
        run: ruff check app tests

      - name: Pytest
        run: python -m pytest -v

      - name: Mypy
        run: mypy app