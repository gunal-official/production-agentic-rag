[project]
name = "agentic-rag-api"
version = "0.1.0"
description = "Production Agentic RAG Platform API"
requires-python = ">=3.11,<3.14"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "psycopg[binary]",
    "alembic",
    "python-multipart",
    "httpx",
    "pgvector",
    "sentence-transformers",
    "openai",
    "pypdf",
    "python-docx",
    "langgraph",
    "arize-phoenix",
    "arize-phoenix-otel",
    "openinference-instrumentation",
    "openinference-instrumentation-langchain",
    "openinference-instrumentation-openai",
    "slowapi",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["alembic*", "tests*"]


[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "BLE"]

[tool.ruff.lint.per-file-ignores]
"app/api/routes/*.py" = ["B008"]